# sops policy: every secret is encrypted to BOTH the admin (this Mac) and the
# avocado host, so you can edit and the box can decrypt at boot.
#
# Recipients:
#   admin   -> ~/.config/sops/age/keys.txt  (edit secrets from your Mac)
#   avocado -> /var/lib/sops-nix/key.txt     (host decrypts at activation)
keys:
  - &admin age1lfwpymp7pwv0tcgyrvmtamz6stzcrkazvvmvmpkknfl59h88d5uq7p5j0k
  - &avocado age1yhw9dwuqnjxlcuntvmd2ce2fnaenkfym2zvkj2caq4h6rscwys9qh0na3k

creation_rules:
  - path_regex: secrets/avocado\.yaml$
    key_groups:
      - age:
          - *admin
          - *avocado
  - path_regex: secrets/ssh_id_ed25519$
    key_groups:
      - age:
          - *admin
          - *avocado

  - path_regex: secrets/cloudflared_credentials\.json$
    key_groups:
      - age:
          - *admin
          - *avocado

  # Monitoring helm values secret (Grafana admin password, ntfy token). Decrypted
  # at deploy time by helm-secrets on the admin machine; the box never reads it,
  # but we still encrypt to avocado for consistency / future in-box deploys.
  - path_regex: secrets/monitoring\.enc\.yaml$
    key_groups:
      - age:
          - *admin
          - *avocado

  # ESPHome secrets.yaml (WiFi creds, API keys). Decrypted at deploy time on
  # the admin machine into a k8s Secret (`just esphome-deploy`); encrypted to
  # avocado too for consistency / future in-box deploys.
  - path_regex: secrets/esphome\.enc\.yaml$
    key_groups:
      - age:
          - *admin
          - *avocado

  # Formance Ledger k8s Secret (DB password, POSTGRES_URI, console COOKIE_SECRET).
  # A full k8s Secret manifest, decrypted at deploy time on the admin machine
  # (`just formance-deploy`); encrypted to avocado too for consistency.
  - path_regex: secrets/formance\.enc\.yaml$
    key_groups:
      - age:
          - *admin
          - *avocado

  # CARE k8s Secrets (Django keys, JWKS, Postgres + MinIO credentials): one
  # for the core stack (k8s/care), one for the TeleICU gateway stack
  # (k8s/care-teleicu). Full k8s Secret manifests, decrypted at deploy time
  # (`just care-deploy` / `just care-teleicu-deploy`); encrypted to avocado
  # too for consistency.
  - path_regex: secrets/care\.enc\.yaml$
    key_groups:
      - age:
          - *admin
          - *avocado
  - path_regex: secrets/care-teleicu\.enc\.yaml$
    key_groups:
      - age:
          - *admin
          - *avocado

  # Kite dashboard k8s Secret (JWT + encrypt keys, GitHub OAuth app id/secret,
  # break-glass super-user password). A full k8s Secret manifest, decrypted at
  # deploy time on the admin machine (`just kite-deploy`); encrypted to avocado
  # too for consistency.
  - path_regex: secrets/kite\.enc\.yaml$
    key_groups:
      - age:
          - *admin
          - *avocado

  # Open Terminology Server k8s Secret (Postgres credentials + the four OTS_*_URL
  # connection strings + OTS_API_KEY). A full k8s Secret manifest, decrypted at
  # deploy time on the admin machine (`just ots-deploy`); encrypted to avocado
  # too for consistency.
  - path_regex: secrets/ots\.enc\.yaml$
    key_groups:
      - age:
          - *admin
          - *avocado

  # Attic (Nix binary cache) k8s Secret — the base64 HS256 key atticd uses to
  # sign/verify access tokens. A full k8s Secret manifest, decrypted at deploy
  # time on the admin machine (`just attic-deploy`); encrypted to avocado too
  # for consistency.
  - path_regex: secrets/attic\.enc\.yaml$
    key_groups:
      - age:
          - *admin
          - *avocado
