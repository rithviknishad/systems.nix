# nginx's connection/request counters for prometheus-nginx-exporter
# (lumine/metrics/nginx-exporter.default). Loopback only; the exporter is
# what the tailnet scrapes. Installed to /etc/nginx/conf.d/ by
# lumine/provision.sh.
server {
  listen 127.0.0.1:8081;
  server_tokens off;
  access_log off;

  location = /stub_status {
    stub_status;
  }
  location / {
    return 404;
  }
}
