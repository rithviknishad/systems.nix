# care-box.rithviknishad.dev: ONE origin, path-routed like avocado's `care`
# Ingress (k8s/care/care.yaml), with paths forwarded unmodified. Loopback only:
# cloudflared (lumine/cloudflared/config.yml) is the sole client. Installed to
# /etc/nginx/conf.d/ by lumine/provision.sh; see docs/care-box.md.
#
# Django admin is deliberately NOT routed: only /api/ reaches the backend,
# so /admin/* is the SPA's own admin UI on this origin.
server {
  listen 127.0.0.1:80 default_server;
  server_name care-box.rithviknishad.dev;
  server_tokens off;

  # Cloudflare's free plan caps request bodies at 100 MB anyway.
  client_max_body_size 100m;

  include mime.types;
  # Module scripts must be served as JavaScript or browsers refuse them.
  types {
    text/javascript js mjs;
  }

  # The SPA's API and the ABDM callbacks (/api/abdm/...). Requests are
  # buffered (nginx's default), which keeps slow clients off gunicorn's sync
  # workers; uploads don't come through here (they go to the buckets).
  location /api/ {
    proxy_pass http://127.0.0.1:9000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # https, as set by cloudflared; Django trusts it (SECURE_PROXY_SSL_HEADER)
    # to build correct absolute URLs. Only cloudflared can reach this server.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Presigned uploads/downloads and facility cover URLs, path-style.
  # (/|$) so bucket-level requests (e.g. an anonymous LIST of /care-uploads)
  # reach the gateway and get its 403, rather than the SPA's index.html.
  location ~ ^/(care-uploads|care-facility)(/|$) {
    proxy_pass http://127.0.0.1:7070;
    # SigV4 signs Host: the gateway must see the host the URL was signed for.
    proxy_set_header Host $host;
    # Stream bodies through instead of spooling up to 100 MB per upload onto
    # the SD card (and downloads into memory).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
  }

  # The ABDM MFE, built with --base=/mfe-plugs/abdm/ and shipped by
  # `just box-fe`. Same rules as k8s/care/abdm-fe/nginx.conf on avocado.
  # remoteEntry.js has a stable name, so it must be revalidated on every load,
  # or care_fe keeps running a stale plug after a rebuild.
  location = /mfe-plugs/abdm/assets/remoteEntry.js {
    root /opt/care/abdm-fe/current/html;
    add_header Cache-Control "no-cache";
  }
  # Everything else under assets/ is content-hashed by Vite.
  location /mfe-plugs/abdm/assets/ {
    root /opt/care/abdm-fe/current/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location /mfe-plugs/abdm/ {
    root /opt/care/abdm-fe/current/html;
    try_files $uri =404;
  }

  # The SPA, with care_fe's own nginx/nginx.conf rules (what avocado's
  # care-fe image serves): security headers, cache times, index.html
  # fallback for client-side routes. The headers sit in this location rather
  # than at server level so the API and the MFE don't get them (as on
  # avocado); the nested index.html location inherits them.
  location / {
    root /opt/care/fe/current/html;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(self)" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://cdn.ohc.network https://egov-s3-facility-10bedicu.s3.amazonaws.com https://egov-s3-patient-data-10bedicu.s3.amazonaws.com; object-src 'self' https://egov-s3-facility-10bedicu.s3.amazonaws.com https://egov-s3-patient-data-10bedicu.s3.amazonaws.com" always;
    expires 7d;
    try_files $uri $uri/ /index.html;

    location = /index.html {
      expires 6h;
    }
  }
}
