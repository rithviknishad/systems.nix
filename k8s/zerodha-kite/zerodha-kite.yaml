# Zerodha Kite MCP server on k3s — a Model Context Protocol server that gives AI
# clients (Claude Desktop, VS Code, ...) access to the Kite Connect trading API.
#
# Deploy:   just zerodha-kite-deploy   (kubectl apply -k k8s/zerodha-kite + sops secret)
# Watch:    kubectl -n zerodha-kite get pods -w
# Reach:    https://avocado.orthrus-bass.ts.net:8443/mcp  (MCP, streamable HTTP) — TAILNET ONLY
#           https://avocado.orthrus-bass.ts.net:8443/sse  (MCP, SSE transport)
#           https://avocado.orthrus-bass.ts.net:8443/     (status page)
# See docs/zerodha-kite.md for the client setup and the Kite Connect app steps.
#
# EXPOSURE — the pod speaks plain HTTP on the NodePort below (30080); Tailscale
# `serve` (modules/zerodha-kite.nix) terminates TLS with the box's Let's
# Encrypt cert and proxies https://<magicdns>:8443 -> http://<box>:30080. The
# HTTPS :8443 URL is the canonical one (the Kite console requires an HTTPS
# Redirect URL); :30080 is the internal backend.
#
# WHY the browser needs a real URL: the auth flow is BROWSER-based. The `login`
# tool returns <PUBLIC_BASE_URL>/authorize; after the Kite login the browser is
# redirected to <PUBLIC_BASE_URL>/callback with a request_token. So the
# client's browser must reach the server at the exact same host:port as the MCP
# transport — hence one canonical HTTPS URL (avocado.<tailnet>.ts.net:8443).
#
# WHY this stays tailnet-only: the MagicDNS name resolves only inside the
# tailnet, and the NodePort range is NOT in the host's allowedTCPPorts
# (modules/k3s.nix) — reachable over the tailnet, blocked on WAN/LAN. No public
# route, no Cloudflare gate. Deliberate: the server can place REAL trades.
#
# WHY no EXCLUDED_TOOLS: this is a private, single-user instance behind the
# tailnet, so the full tool set (incl. place/modify/cancel order + GTT) is
# enabled. The hosted mcp.kite.trade strips destructive tools because it is
# public; we don't need to.
---
apiVersion: v1
kind: Namespace
metadata:
  name: zerodha-kite
---
# Non-secret configuration. KITE_API_KEY / KITE_API_SECRET are the only secrets
# and live in the sops-backed `zerodha-kite-secret` (applied by
# `just zerodha-kite-deploy`); everything else is here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zerodha-kite-env
  namespace: zerodha-kite
data:
  # hybrid = serve BOTH /mcp (streamable HTTP) and /sse (SSE) on one port, so
  # any client's preferred transport works.
  APP_MODE: hybrid
  APP_PORT: "8080"
  # Bind all interfaces inside the pod (default is localhost, unreachable from
  # the Service).
  APP_HOST: 0.0.0.0
  # The public, browser-facing base URL. MUST match (a) the Tailscale `serve`
  # front door in modules/zerodha-kite.nix and (b) the Redirect URL registered
  # on the Kite Connect app (<PUBLIC_BASE_URL>/callback). The MagicDNS name
  # resolves via Tailscale; TLS is the box's Let's Encrypt cert.
  PUBLIC_BASE_URL: https://avocado.orthrus-bass.ts.net:8443
  LOG_LEVEL: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zerodha-kite
  namespace: zerodha-kite
spec:
  replicas: 1
  selector:
    matchLabels: { app: zerodha-kite }
  template:
    metadata:
      labels: { app: zerodha-kite }
      annotations:
        # Bump to roll the pod when the ConfigMap changes (env is not
        # auto-reloaded on ConfigMap edits).
        checksum/config: config-v2
    spec:
      containers:
        - name: zerodha-kite
          image: zerodha-kite:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          envFrom:
            # Non-secret config first, then the sops secret (KITE_API_KEY /
            # KITE_API_SECRET). The secret is applied by just zerodha-kite-deploy,
            # not part of the kustomize build.
            - configMapRef: { name: zerodha-kite-env }
            - secretRef: { name: zerodha-kite-secret }
          # The status page at / returns 200 once the server is up; use it as
          # the health signal (no dedicated /healthz on this server).
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "1000m", memory: "512Mi" }
          volumeMounts:
            # The instruments manager and Go runtime may write scratch files;
            # the image has no writable /tmp of its own.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# NodePort (30080) is the plain-HTTP backend that the Tailscale `serve` front
# door (modules/zerodha-kite.nix) proxies HTTPS/:8443 to. It is pinned so
# PUBLIC_BASE_URL / the serve target / the Kite redirect URL stay stable across
# restarts. 30080 mirrors the container's 8080 for legibility.
apiVersion: v1
kind: Service
metadata:
  name: zerodha-kite
  namespace: zerodha-kite
spec:
  type: NodePort
  selector: { app: zerodha-kite }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
