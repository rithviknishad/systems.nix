apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - zerodha-kite.yaml
# The zerodha-kite-secret (KITE_API_KEY + KITE_API_SECRET) is NOT part of this
# build. It is stored sops-encrypted at secrets/zerodha-kite.enc.yaml and
# applied at deploy time by `just zerodha-kite-deploy`. See secret.example.yaml.
