---
# zfs-vmrules.yaml — VMRule for ZFS host-level monitoring.
#
# Pool-state, capacity and snapshot-coverage alerts read the node_zfs_* metrics
# emitted by the NixOS `zfs-textfile-metrics` timer (modules/monitoring.nix)
# into node-exporter's textfile collector. ARC/ZIL alerts use node-exporter's
# built-in ZFS collector (/proc/spl/kstat/zfs/).
#
# avocado's rpool is a NO-REDUNDANCY stripe across two disks — losing either
# disk destroys the pool — so ZFSPoolNotOnline/Faulted are the highest-value
# alerts here. ZFSSnapshotsMissing is a close second: it is the guard against
# rolling snapshots silently not happening (see docs/storage.md).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: zfs-host-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: zfs
    app.kubernetes.io/component: alerting
    app.kubernetes.io/part-of: victoria-metrics-k8s-stack
    app.kubernetes.io/managed-by: kustomize
spec:
  groups:
    - name: zfs-pool-health
      rules:
        - alert: ZFSPoolNotOnline
          expr: |-
            node_zfs_zpool_state{state="online"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "ZFS pool {{ $labels.zpool }} is not online"
            description: >-
              ZFS pool {{ $labels.zpool }} on {{ $labels.instance }} is not in
              the ONLINE state. Check `zpool status {{ $labels.zpool }}` for
              details.

        - alert: ZFSPoolDegraded
          expr: |-
            node_zfs_zpool_state{state="degraded"} == 1
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "ZFS pool {{ $labels.zpool }} is degraded"
            description: >-
              ZFS pool {{ $labels.zpool }} on {{ $labels.instance }} is in a
              DEGRADED state. Run `zpool status {{ $labels.zpool }}` to identify
              the affected vdev.

        - alert: ZFSPoolFaulted
          expr: |-
            node_zfs_zpool_state{state="faulted"} == 1
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "ZFS pool {{ $labels.zpool }} is FAULTED"
            description: >-
              ZFS pool {{ $labels.zpool }} on {{ $labels.instance }} has
              FAULTED. All data on this pool is inaccessible until the fault
              is resolved.

    - name: zfs-capacity
      rules:
        # Rolling snapshots (modules/zfs.nix) retain freed blocks, so deleting
        # a large PVC no longer frees space immediately — it frees it when the
        # snapshot ages out. That makes capacity a live concern rather than a
        # slow drift, and a ZFS pool at 100% is genuinely painful to recover
        # from (you can need free space just to delete things).
        - alert: ZFSPoolFillingUp
          expr: |-
            (node_zfs_zpool_allocated_bytes / node_zfs_zpool_size_bytes) > 0.80
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "ZFS pool {{ $labels.zpool }} is over 80% full"
            description: >-
              ZFS pool {{ $labels.zpool }} on {{ $labels.instance }} is
              {{ $value | humanizePercentage }} allocated. Check snapshot usage
              with `zfs list -o space -r {{ $labels.zpool }}` — old snapshots
              holding freed blocks are the usual cause.

        - alert: ZFSPoolCriticallyFull
          expr: |-
            (node_zfs_zpool_allocated_bytes / node_zfs_zpool_size_bytes) > 0.90
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "ZFS pool {{ $labels.zpool }} is over 90% full"
            description: >-
              ZFS pool {{ $labels.zpool }} on {{ $labels.instance }} is
              {{ $value | humanizePercentage }} allocated. ZFS performance
              degrades badly near full and freeing space can itself require
              space. Destroy old snapshots or move data off the pool now.

    - name: zfs-snapshots
      rules:
        # The failure these two exist for: on 2026-08-31 the care namespace was
        # deleted and there was no snapshot to recover from, because the
        # snapshot timers had been running green for 73 days while the datasets
        # were tagged com.sun:auto-snapshot=false. Green timers proved nothing.
        # These alert on the ARTIFACT (snapshots existing and being fresh)
        # rather than on the job exiting 0.
        - alert: ZFSSnapshotsMissing
          expr: |-
            node_zfs_dataset_snapshot_count == 0
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "ZFS dataset {{ $labels.dataset }} is tagged for snapshots but has none"
            description: >-
              {{ $labels.dataset }} has com.sun:auto-snapshot=true but zero
              snapshots exist. Rolling snapshots are NOT protecting this
              dataset. Check `systemctl status zfs-snapshot-frequent.service`
              and `journalctl -u zfs-snapshot-properties`.

        - alert: ZFSSnapshotsStale
          expr: |-
            node_zfs_dataset_latest_snapshot_timestamp_seconds > 0
            and
            (time() - node_zfs_dataset_latest_snapshot_timestamp_seconds) > 7200
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ZFS snapshots for {{ $labels.dataset }} are stale"
            description: >-
              The newest snapshot of {{ $labels.dataset }} is
              {{ $value | humanizeDuration }} old. The `frequent` timer should
              be creating one every 15 minutes, so snapshotting has stalled.

    - name: zfs-arc
      rules:
        - alert: ZFSARCHitRatioLow
          expr: |-
            (
              rate(node_zfs_arc_hits[5m])
              /
              (rate(node_zfs_arc_hits[5m]) + rate(node_zfs_arc_misses[5m]))
            ) < 0.8
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ZFS ARC hit ratio is below 80%"
            description: >-
              ZFS ARC hit ratio on {{ $labels.instance }} is
              {{ $value | humanizePercentage }} (5m average).

        - alert: ZFSARCShrunk
          expr: |-
            (node_zfs_arc_size / node_zfs_arc_c_max) < 0.5
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "ZFS ARC is significantly below target size"
            description: >-
              ZFS ARC on {{ $labels.instance }} is using only
              {{ $value | humanizePercentage }} of its maximum target size.

    - name: zfs-io
      rules:
        - alert: ZFSHighZILCommitRate
          expr: |-
            rate(node_zfs_zil_zil_commit_count[5m]) > 1000
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "ZFS ZIL commit rate is high"
            description: >-
              ZIL commit rate on {{ $labels.instance }} is
              {{ $value | humanize }}/s over the last 5 minutes.
