# Shape of the `formance-secret` Secret consumed by the Deployments.
#
# The REAL values live sops-encrypted in secrets/formance.enc.yaml and are
# applied by `just formance-deploy` — this file is only a reference and is
# safe to commit (no real secrets here). To create/edit the encrypted copy:
#
#   just formance-secrets     # opens secrets/formance.enc.yaml in sops
#
# Paste a manifest like the one below (with real values), then deploy:
#
#   just formance-deploy
#
# POSTGRES_URI must embed the same password as POSTGRES_PASSWORD, e.g.
#   postgresql://ledger:<password>@postgres/ledger?sslmode=disable
# COOKIE_SECRET is any long random string (console session signing key).
apiVersion: v1
kind: Secret
metadata:
  name: formance-secret
  namespace: formance
stringData:
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_URI: postgresql://ledger:CHANGE_ME@postgres/ledger?sslmode=disable
  COOKIE_SECRET: CHANGE_ME_LONG_RANDOM
