# values-secret.example.yaml — shape of the sops-encrypted helm values.
#
# The real file is secrets/signoz.enc.yaml (sops/age). `just signoz-deploy`
# decrypts it to k8s/signoz/values-secret.yaml (gitignored) right before
# `helmfile sync`, and helm merges it over values.yaml.
#
# Edit it with:   just signoz-secrets
# Generate a password with: openssl rand -hex 24
#
# The chart ships a hard-coded default ClickHouse password. ClickHouse is only
# reachable inside the cluster, but leaving a published default in place means
# anything that lands in the cluster can read every trace and log — so set a
# real one here.
#
# Changing this AFTER the first deploy: the operator rewrites the ClickHouse
# user, so the password rotates cleanly, but the collector and query service
# need a restart to pick it up (`just signoz-deploy` rolls them).
clickhouse:
  password: replace-me-with-openssl-rand-hex-24
