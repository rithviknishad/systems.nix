# Server-level config shared by both care-box origins in
# lumine/nginx/care-box.conf (public + tailnet): everything that doesn't
# depend on which hostname the request came in on. Installed to
# /etc/nginx/snippets/ (not conf.d/, which nginx would load on its own as a
# top-level file) by lumine/provision.sh.
server_tokens off;

# Cloudflare's free plan caps request bodies at 100 MB anyway; the tailnet
# origin keeps the same limit so the two behave alike.
client_max_body_size 100m;

include mime.types;
# Module scripts must be served as JavaScript or browsers refuse them.
types {
  text/javascript js mjs;
}

# The ABDM MFE, built with --base=/mfe-plugs/abdm/ and shipped by
# `just box-fe`. Same rules as k8s/care/abdm-fe/nginx.conf on avocado.
# remoteEntry.js has a stable name, so it must be revalidated on every load,
# or care_fe keeps running a stale plug after a rebuild.
location = /mfe-plugs/abdm/assets/remoteEntry.js {
  root /opt/care/abdm-fe/current/html;
  add_header Cache-Control "no-cache";
}
# Everything else under assets/ is content-hashed by Vite.
location /mfe-plugs/abdm/assets/ {
  root /opt/care/abdm-fe/current/html;
  add_header Cache-Control "public, max-age=31536000, immutable";
}
location /mfe-plugs/abdm/ {
  root /opt/care/abdm-fe/current/html;
  try_files $uri =404;
}

# The SPA, with care_fe's own nginx/nginx.conf rules (what avocado's
# care-fe image serves): security headers, cache times, index.html
# fallback for client-side routes. The headers sit in this location rather
# than at server level so the API and the MFE don't get them (as on
# avocado); the nested index.html location inherits them. img-src allows
# data: because the login-page logo is inlined as a data: URL (`just box-fe`).
location / {
  root /opt/care/fe/current/html;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), microphone=(self)" always;
  add_header Content-Security-Policy-Report-Only "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.ohc.network https://egov-s3-facility-10bedicu.s3.amazonaws.com https://egov-s3-patient-data-10bedicu.s3.amazonaws.com; object-src 'self' https://egov-s3-facility-10bedicu.s3.amazonaws.com https://egov-s3-patient-data-10bedicu.s3.amazonaws.com" always;
  expires 7d;
  try_files $uri $uri/ /index.html;

  location = /index.html {
    expires 6h;
  }
}
