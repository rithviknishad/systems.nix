# Shape of the `ots-secret` Secret consumed by the OTS stack (postgres, api,
# worker).
#
# The REAL values live sops-encrypted in secrets/ots.enc.yaml and are applied
# by `just ots-deploy` — this file is only a reference and is safe to commit
# (no real secrets here). To create/edit the encrypted copy:
#
#   just ots-secrets           # opens secrets/ots.enc.yaml in sops
#
# Notes on individual values:
# - POSTGRES_* configure the postgres pod. The four OTS_*_URL values must all
#   embed the SAME password as POSTGRES_PASSWORD and point at host `postgres`
#   (the in-cluster Service), database/user `ots`.
# - OTS_API_KEY is the shared bearer for every non-public path (sent as the
#   `x-api-key` header). Generate a strong one, e.g. `openssl rand -hex 32`,
#   and hand the same value to CARE / other clients.
# - POSTGRES_PASSWORD: any long random string, e.g. `openssl rand -hex 24`.
#
apiVersion: v1
kind: Secret
metadata:
  name: ots-secret
  namespace: ots
stringData:
  # Postgres (consumed by the postgres pod; the URLs below by api + worker)
  POSTGRES_USER: ots
  POSTGRES_DB: ots
  POSTGRES_PASSWORD: CHANGE_ME_LONG_RANDOM
  # Connection strings — keep the password in sync with POSTGRES_PASSWORD.
  OTS_DATABASE_URL: postgresql://ots:CHANGE_ME_LONG_RANDOM@postgres:5432/ots
  OTS_SQLALCHEMY_DATABASE_URL: postgresql+psycopg://ots:CHANGE_ME_LONG_RANDOM@postgres:5432/ots
  OTS_CELERY_BROKER_URL: sqla+postgresql+psycopg://ots:CHANGE_ME_LONG_RANDOM@postgres:5432/ots
  OTS_CELERY_RESULT_BACKEND: db+postgresql+psycopg://ots:CHANGE_ME_LONG_RANDOM@postgres:5432/ots
  # Shared API key (x-api-key header) for every non-public path.
  OTS_API_KEY: CHANGE_ME_STRONG_RANDOM
