# Shape of the `teleicu-secret` Secret consumed by the TeleICU gateway stack
# (middleware, celery, postgres, backup cronjob).
#
# The REAL values live sops-encrypted in secrets/care-teleicu.enc.yaml and are
# applied by `just care-teleicu-deploy` — this file is only a reference and is
# safe to commit. To create/edit the encrypted copy:
#
#   just care-teleicu-secrets      # opens secrets/care-teleicu.enc.yaml
#
# Notes:
# - DATABASE_URL must embed the same password as POSTGRES_PASSWORD.
# - S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY = the MinIO root credentials from
#   secrets/care.enc.yaml (MINIO_ROOT_USER / MINIO_ROOT_PASSWORD) — the
#   gateway stores camera snapshots in the shared MinIO's teleicu-gateway
#   bucket.
# - JWKS_BASE64: the gateway's OWN signing keys (distinct from care's!) —
#   it authenticates to CARE with JWTs signed by this key set, and publishes
#   the public half for CARE to verify. Same generation one-liner as in
#   k8s/care/secret.example.yaml (any image with authlib works, e.g. the
#   gateway image itself with --entrypoint python).
# - SECRET_KEY: any long random string, e.g. `openssl rand -hex 48`.
apiVersion: v1
kind: Secret
metadata:
  name: teleicu-secret
  namespace: care-teleicu
stringData:
  # Postgres (consumed by the postgres pod; DATABASE_URL by the middleware).
  # DB name matches upstream's default (teleicu_middleware).
  POSTGRES_USER: teleicu
  POSTGRES_DB: teleicu_middleware
  POSTGRES_PASSWORD: CHANGE_ME
  DATABASE_URL: postgres://teleicu:CHANGE_ME@postgres:5432/teleicu_middleware
  # Django
  SECRET_KEY: CHANGE_ME_LONG_RANDOM
  JWKS_BASE64: CHANGE_ME_SEE_COMMENT_ABOVE
  # Shared MinIO (care namespace) credentials
  S3_ACCESS_KEY_ID: care-admin
  S3_SECRET_ACCESS_KEY: CHANGE_ME
