apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - settle-up-mcp.yaml
# The settle-up-mcp-secret (Settle Up credentials, Firebase API key, MCP bearer
# token) is NOT part of this build. It is stored sops-encrypted at
# secrets/settle-up-mcp.enc.yaml and applied at deploy time by
# `just settle-up-mcp-deploy`. See secret.example.yaml.
