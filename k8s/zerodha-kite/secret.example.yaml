# Shape of the `zerodha-kite-secret` Secret consumed by the Kite MCP Deployment.
#
# The REAL values live sops-encrypted in secrets/zerodha-kite.enc.yaml and are
# applied by `just zerodha-kite-deploy` — this file is only a reference and is
# safe to commit (no real secrets here). To create/edit the encrypted copy:
#
#   just zerodha-kite-secrets     # opens secrets/zerodha-kite.enc.yaml in sops
#
# Paste your real values, then deploy:
#
#   just zerodha-kite-deploy
#
# Keys — both come from a Kite Connect app you create at
# https://developers.kite.trade (see docs/zerodha-kite.md):
#   KITE_API_KEY      The app's API key.
#   KITE_API_SECRET   The app's API secret.
#
# IMPORTANT: on the Kite Connect app, set the "Redirect URL" to exactly
#   https://avocado.orthrus-bass.ts.net:8443/callback
# (matches PUBLIC_BASE_URL in k8s/zerodha-kite/zerodha-kite.yaml, which is
# fronted by Tailscale HTTPS — see modules/zerodha-kite.nix). Without the exact
# match the browser login will fail.
apiVersion: v1
kind: Secret
metadata:
  name: zerodha-kite-secret
  namespace: zerodha-kite
stringData:
  KITE_API_KEY: CHANGE_ME
  KITE_API_SECRET: CHANGE_ME
