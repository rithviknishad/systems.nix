# Shape of the `kite-secret` Secret consumed by the Kite Deployment.
#
# The REAL values live sops-encrypted in secrets/kite.enc.yaml and are applied
# by `just kite-deploy` — this file is only a reference and is safe to commit
# (no real secrets here). To create/edit the encrypted copy:
#
#   just kite-secrets     # opens secrets/kite.enc.yaml in sops
#
# Paste a manifest like the one below (with real values), then deploy:
#
#   just kite-deploy
#
# Keys:
#   JWT_SECRET            Any long random string. Signs Kite session JWTs.
#   KITE_ENCRYPT_KEY      Any long random string. Encrypts sensitive DB columns
#                         (OAuth client secret, kubeconfigs). Keep it STABLE —
#                         changing it makes previously encrypted values unreadable.
#   GITHUB_CLIENT_ID      From the GitHub OAuth app (not secret, kept here for
#                         one-stop setup). See docs/kite.md for how to create it.
#   GITHUB_CLIENT_SECRET  From the GitHub OAuth app.
#   KITE_SUPERUSER_PASSWORD  Break-glass password for the `admin` account.
#
# Generate a random value with:  openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: kite-secret
  namespace: kite
stringData:
  JWT_SECRET: CHANGE_ME_LONG_RANDOM
  KITE_ENCRYPT_KEY: CHANGE_ME_LONG_RANDOM
  GITHUB_CLIENT_ID: CHANGE_ME
  GITHUB_CLIENT_SECRET: CHANGE_ME
  KITE_SUPERUSER_PASSWORD: CHANGE_ME_LONG_RANDOM
