# Static host for the care-abdm MFE. Traefik forwards /mfe-plugs/abdm/*
# unchanged, and the files live at the same path under the root.
server {
  listen 80;
  root /usr/share/nginx/html;

  include mime.types;
  # Module scripts must be served as JavaScript or the browser refuses them.
  types {
    text/javascript js mjs;
  }

  # remoteEntry.js has a stable name, so it must be revalidated every load or
  # care_fe keeps running a stale plug after a rebuild.
  location = /mfe-plugs/abdm/assets/remoteEntry.js {
    add_header Cache-Control "no-cache";
  }

  # Everything else under assets/ is content-hashed by Vite.
  location /mfe-plugs/abdm/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri =404;
  }
}
