# Postgres tuning for lumine: 2 GB of RAM shared with gunicorn, celery,
# redis and the OS (lumine/PLAN.md "Memory budget"). Installed into
# /etc/postgresql/17/main/conf.d/ by lumine/provision.sh; a change here needs
# `just box-provision`, which restarts postgres when this file changes.

# ~6% of RAM instead of the usual 25%: everything else on the box needs the
# memory more, and the kernel page cache still caches the hot pages.
shared_buffers = 128MB
# Planner hint only (allocates nothing): what the page cache can plausibly
# hold for postgres once the app processes are resident.
effective_cache_size = 512MB
# Per sort/hash node per backend, so it multiplies with connections; CARE's
# queries are OLTP-sized.
work_mem = 4MB
maintenance_work_mem = 64MB
# 2 gunicorn workers + celery worker + beat + the odd manage.py need ~10.
# Every slot reserves shared memory, so stay well below the default 100.
max_connections = 30
# JIT costs a burst of CPU and memory per query and only pays off for long
# analytical queries, which CARE doesn't run.
jit = off
# Fewer checkpoints = fewer full-page writes to the SD card, at the cost of a
# slightly longer crash recovery.
checkpoint_timeout = 15min
