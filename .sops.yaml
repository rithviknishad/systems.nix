# sops policy: every secret is encrypted to the admin (this Mac) plus the host(s)
# that need it, so you can edit and the box can decrypt at boot.
#
# Recipients:
#   admin    -> ~/.config/sops/age/keys.txt  (edit secrets from your Mac)
#   avocado  -> /var/lib/sops-nix/key.txt     (host decrypts at activation)
#   headless -> derived from its SSH host key (ssh-keyscan -t ed25519 <ip> |
#               ssh-to-age); a reinstall changes it -> update + rekey.
#   g8way    -> same mechanism as headless.
keys:
  - &admin age1lfwpymp7pwv0tcgyrvmtamz6stzcrkazvvmvmpkknfl59h88d5uq7p5j0k
  - &avocado age1yhw9dwuqnjxlcuntvmd2ce2fnaenkfym2zvkj2caq4h6rscwys9qh0na3k
  - &headless age1c7p5g050d4k6xne7e57y8tuzsf4xrpwgstdxv9ws954a6v4cyqxq7c7pja
  - &g8way age180mjswuzvh7e92tajuz5m2v47zynyf2ajc6z9ejruhtt2lvzwpwq73nrs7

creation_rules:
  - path_regex: secrets/avocado\.yaml$
    key_groups:
      - age:
          - *admin
          - *avocado
  # headless's own file (password hash, tailscale auth key, k3s join token) —
  # deliberately NOT avocado.yaml, so the worker can't read avocado's secrets.
  - path_regex: secrets/headless\.yaml$
    key_groups:
      - age:
          - *admin
          - *headless
  # g8way's own file (same three secrets as headless's), same reasoning.
  - path_regex: secrets/g8way\.yaml$
    key_groups:
      - age:
          - *admin
          - *g8way
  # rithviknishad's personal SSH key, for every host that runs Home Manager
  # (modules/home-manager.nix). g8way is the jumpbox, so it gets it too —
  # a deliberate tradeoff: the key is now on two machines' disks.
  - path_regex: secrets/ssh_id_ed25519$
    key_groups:
      - age:
          - *admin
          - *avocado
          - *g8way

  - path_regex: secrets/cloudflared_credentials\.json$
    key_groups:
      - age:
          - *admin
          - *avocado

  # Monitoring helm values secret (Grafana admin password, ntfy token). Decrypted
  # at deploy time by helm-secrets on the admin machine; the box never reads it,
  # but we still encrypt to avocado for consistency / future in-box deploys.
  - path_regex: secrets/monitoring\.enc\.yaml$
    key_groups:
      - age:
          - *admin
          - *avocado


  # CARE k8s Secrets (Django keys, JWKS, Postgres, S3, ABDM credentials): one
  # for the core stack (k8s/care), one for the TeleICU gateway stack
  # (k8s/care-teleicu). Full k8s Secret manifests, decrypted at deploy time
  # (`just care-deploy` / `just care-teleicu-deploy`); encrypted to avocado
  # too for consistency.
  - path_regex: secrets/care\.enc\.yaml$
    key_groups:
      - age:
          - *admin
          - *avocado
  - path_regex: secrets/care-teleicu\.enc\.yaml$
    key_groups:
      - age:
          - *admin
          - *avocado

  # Kite dashboard k8s Secret (JWT + encrypt keys, GitHub OAuth app id/secret,
  # break-glass super-user password). A full k8s Secret manifest, decrypted at
  # deploy time on the admin machine (`just kite-deploy`); encrypted to avocado
  # too for consistency.
  - path_regex: secrets/kite\.enc\.yaml$
    key_groups:
      - age:
          - *admin
          - *avocado


  # Attic (Nix binary cache) k8s Secret — the base64 HS256 key atticd uses to
  # sign/verify access tokens. A full k8s Secret manifest, decrypted at deploy
  # time on the admin machine (`just attic-deploy`); encrypted to avocado too
  # for consistency.
  - path_regex: secrets/attic\.enc\.yaml$
    key_groups:
      - age:
          - *admin
          - *avocado

  # Zerodha Kite MCP server k8s Secret (KITE_API_KEY + KITE_API_SECRET of the
  # Kite Connect app). A full k8s Secret manifest, decrypted at deploy time on
  # the admin machine (`just zerodha-kite-deploy`); encrypted to avocado too
  # for consistency.
  - path_regex: secrets/zerodha-kite\.enc\.yaml$
    key_groups:
      - age:
          - *admin
          - *avocado


  # Settle Up MCP server k8s Secret (Settle Up account email + password, the
  # live Firebase Web API key, and the MCP bearer token clients must send). A
  # full k8s Secret manifest, decrypted at deploy time on the admin machine
  # (`just settle-up-mcp-deploy`); encrypted to avocado too for consistency.
  - path_regex: secrets/settle-up-mcp\.enc\.yaml$
    key_groups:
      - age:
          - *admin
          - *avocado

  # Mailpit (SMTP sink) k8s Secret — the SMTP and web-UI password files. A
  # full k8s Secret manifest, decrypted at deploy time on the admin machine
  # (`just mailpit-deploy`); encrypted to avocado too for consistency.
  - path_regex: secrets/mailpit\.enc\.yaml$
    key_groups:
      - age:
          - *admin
          - *avocado

  # lumine (Raspberry Pi, CARE in a box at care-box.rithviknishad.dev; see
  # docs/care-box.md). Its env file and its own cloudflared tunnel credentials.
  # Deliberately NOT encrypted to lumine: avocado/the Mac are its control
  # plane and stream the decrypted values over SSH (`just
  # box-secrets-render`), so the box holds only the rendered files it runs
  # on, never a key that opens the repo's secrets.
  - path_regex: secrets/care-box\.enc\.env$
    key_groups:
      - age:
          - *admin
          - *avocado
  - path_regex: secrets/lumine-cloudflared\.json$
    key_groups:
      - age:
          - *admin
          - *avocado
  # SSH key avocado's care-box-backup service pulls lumine's backups with
  # (binary; modules/care-box.nix). Its public half is in
  # lumine/backup/authorized_keys, locked to a forced command on the Pi.
  - path_regex: secrets/care-box-backup_ed25519$
    key_groups:
      - age:
          - *admin
          - *avocado
