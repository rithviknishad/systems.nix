# Shape of the `atticd-secret` Secret consumed by the atticd Deployment.
#
# The REAL value lives sops-encrypted in secrets/attic.enc.yaml and is applied
# by `just attic-deploy` — this file is only a reference and is safe to commit
# (no real secret here). To create/edit the encrypted copy:
#
#   just attic-secrets         # opens secrets/attic.enc.yaml in sops
#
# ATTIC_SERVER_TOKEN_HS256_SECRET_BASE64 is the HMAC key atticd uses to sign
# AND verify every access token. Generate a strong one:
#
#   openssl rand 64 | base64 -w0
#
# WARNING: changing this value invalidates every token already minted with
# `atticadm make-token` — you must re-issue client tokens after rotating it.
apiVersion: v1
kind: Secret
metadata:
  name: atticd-secret
  namespace: attic
stringData:
  ATTIC_SERVER_TOKEN_HS256_SECRET_BASE64: CHANGE_ME_BASE64_HMAC_KEY
