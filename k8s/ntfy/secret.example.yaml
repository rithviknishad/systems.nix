# Shape of the `ntfy-secret` Secret consumed by the ntfy Deployment.
#
# The REAL value lives sops-encrypted in secrets/ntfy.enc.yaml and is applied by
# `just ntfy-deploy` — this file is only a reference and is safe to commit (no
# real secret here). To create/edit the encrypted copy:
#
#   just ntfy-secrets          # opens secrets/ntfy.enc.yaml in sops
#
# ntfy maps every server.yml option to an env var (NTFY_<OPTION>, dashes ->
# underscores), and list options are COMMA-SEPARATED. These three declare the
# whole auth model at startup, so users/tokens live in git (encrypted) instead
# of only inside user.db on the box:
#
#   NTFY_AUTH_USERS   "<user>:<bcrypt-hash>:<role>"   role = admin | user
#   NTFY_AUTH_ACCESS  "<user>:<topic-pattern>:<perm>" perm = rw | ro | wo | deny
#   NTFY_AUTH_TOKENS  "<user>:<token>[:<label>]"      token = tk_...
#
# Generate the pieces (needs the ntfy binary, or run it in a throwaway pod with
# `just ntfy-gen ...`):
#
#   ntfy user hash                 # prompts for a password, prints $2a$10$...
#   ntfy token generate            # prints a tk_... access token
#
# From this repo, `just ntfy-gen user hash` / `just ntfy-gen token generate`
# runs exactly those in a throwaway pod — no server needed.
#
# Notes:
#   - An `admin` user bypasses ACLs entirely; give scripts a plain `user` plus
#     a narrow NTFY_AUTH_ACCESS entry instead of handing out admin tokens.
#   - Entries are applied on every start, so this file is the source of truth:
#     removing a user here does NOT delete it from user.db — do that with
#     `just ntfy-cli user del <name>`.
#   - Topic patterns support a trailing wildcard, e.g. `alerts-*`.
apiVersion: v1
kind: Secret
metadata:
  name: ntfy-secret
  namespace: ntfy
stringData:
  # Admin account for the web app (full access to everything).
  NTFY_AUTH_USERS: "rithviknishad:CHANGE_ME_BCRYPT_HASH:admin,alerts:CHANGE_ME_BCRYPT_HASH:user"
  # The `alerts` service account may only publish to the alert topics.
  NTFY_AUTH_ACCESS: "alerts:avocado-*:wo"
  # Bearer tokens for non-interactive publishers (Gatus, the Alertmanager
  # bridge, scripts). Sent as `Authorization: Bearer tk_...`.
  NTFY_AUTH_TOKENS: "alerts:tk_CHANGE_ME_ACCESS_TOKEN:avocado alerting"
