# Shape of the `care-secret` Secret consumed by the care stack (backend,
# postgres, minio, bucket bootstrap job, backup cronjob).
#
# The REAL values live sops-encrypted in secrets/care.enc.yaml and are
# applied by `just care-deploy` — this file is only a reference and is safe
# to commit (no real secrets here). To create/edit the encrypted copy:
#
#   just care-secrets          # opens secrets/care.enc.yaml in sops
#
# Notes on individual values:
# - DATABASE_URL must embed the same password as POSTGRES_PASSWORD.
# - BUCKET_KEY/BUCKET_SECRET are what the care backend uses to talk to MinIO;
#   we reuse the MinIO root credentials (single-admin box — a dedicated
#   service account would add ceremony, not security, here).
# - DJANGO_SECRET_KEY: any long random string, e.g. `openssl rand -hex 48`.
# - JWKS_BASE64: base64-encoded JWK set for signing auth tokens. If unset,
#   care generates one at boot — but then every pod restart invalidates all
#   sessions. Generate a stable one with the built backend image:
#
#     docker run --rm --entrypoint python care-backend:local -c "import base64, json; from authlib.jose import JsonWebKey; ks = {'keys': [JsonWebKey.generate_key('RSA', 2048, is_private=True).as_dict(is_private=True, alg='RS256', use='sig')]}; print(base64.b64encode(json.dumps(ks).encode()).decode())"
#
apiVersion: v1
kind: Secret
metadata:
  name: care-secret
  namespace: care
stringData:
  # Postgres (consumed by the postgres pod; DATABASE_URL by the backend)
  POSTGRES_USER: care
  POSTGRES_DB: care
  POSTGRES_PASSWORD: CHANGE_ME
  DATABASE_URL: postgres://care:CHANGE_ME@postgres:5432/care
  # Django
  DJANGO_SECRET_KEY: CHANGE_ME_LONG_RANDOM
  JWKS_BASE64: CHANGE_ME_SEE_COMMENT_ABOVE
  # MinIO root credentials (minio pod) — mirrored as the backend's bucket
  # credentials and reused by the teleicu-gateway stack's S3 settings.
  MINIO_ROOT_USER: care-admin
  MINIO_ROOT_PASSWORD: CHANGE_ME_LONG_RANDOM
  BUCKET_KEY: care-admin
  BUCKET_SECRET: CHANGE_ME_LONG_RANDOM
