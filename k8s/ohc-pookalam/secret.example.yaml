# Shape of the `ohc-pookalam-secret` Secret consumed by the Pookalam vote app.
#
# The REAL value lives sops-encrypted in secrets/ohc-pookalam.enc.yaml and is
# applied by `just ohc-pookalam-deploy` — this file is only a reference and is
# safe to commit (no real secrets here). To create/edit the encrypted copy:
#
#   just ohc-pookalam-secrets    # opens secrets/ohc-pookalam.enc.yaml in sops
#
# The Secret is OPTIONAL (the Deployment's envFrom sets optional: true): the
# app runs without it, but every sign-in calls api.github.com to validate the
# username, and unauthenticated calls are capped at 60/hour per source IP —
# which one shared tunnel egress IP will exhaust within minutes of a real vote.
# A classic PAT with NO scopes at all is enough (public user lookups only);
# it raises the cap to 5000/hour.
#
apiVersion: v1
kind: Secret
metadata:
  name: ohc-pookalam-secret
  namespace: ohc-pookalam
stringData:
  GITHUB_TOKEN: CHANGE_ME_GITHUB_PAT_NO_SCOPES
