# Drop-in for Debian's prometheus-process-exporter.service on lumine
# (/etc/systemd/system/prometheus-process-exporter.service.d/care-box.conf,
# installed by lumine/provision.sh). As the unprivileged `prometheus` user it
# can read every process's /proc/<pid>/stat, but not other users' smaps (PSS)
# or io counters: those need ptrace-level read access. Granting just that
# capability keeps it far from root.
[Service]
AmbientCapabilities=CAP_SYS_PTRACE CAP_DAC_READ_SEARCH
CapabilityBoundingSet=CAP_SYS_PTRACE CAP_DAC_READ_SEARCH
