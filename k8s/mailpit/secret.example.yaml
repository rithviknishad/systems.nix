# Shape of the `mailpit-auth` Secret consumed by the Mailpit Deployment.
#
# The REAL values live sops-encrypted in secrets/mailpit.enc.yaml and are
# applied by `just mailpit-deploy` — this file is only a reference and is safe
# to commit (no real secrets here). To create/edit the encrypted copy:
#
#   just mailpit-secrets     # opens secrets/mailpit.enc.yaml in sops
#
# Keys (each is a Mailpit password file: one `user:password` per line; the
# password may be plain text or bcrypt/apr1/SHA — see
# https://mailpit.axllent.org/docs/configuration/passwords/):
#   smtp-auth   Credentials apps use to AUTH to SMTP. Plain text, because the
#               same password must be handed to the apps (e.g. the csaas
#               bootstrap env file) — sops is what keeps it out of git.
#   ui-auth     Basic-auth credentials for the web inbox + API. Kept separate
#               from smtp-auth so an app credential can't read captured mail.
#
# Generate passwords with e.g. `openssl rand -hex 24` (hex avoids characters
# that need quoting in .env files). Mailpit only reads these at startup, so
# redeploy after editing (`just mailpit-deploy` restarts the pod).
apiVersion: v1
kind: Secret
metadata:
  name: mailpit-auth
  namespace: mailpit
stringData:
  smtp-auth: |
    csaas:CHANGE_ME_STRONG_RANDOM
  ui-auth: |
    admin:CHANGE_ME_STRONG_RANDOM
