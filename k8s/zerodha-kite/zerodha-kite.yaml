# Zerodha Kite MCP server on k3s — a Model Context Protocol server that gives AI
# clients (Claude Desktop, VS Code, ...) access to the Kite Connect trading API.
#
# Deploy:   just zerodha-kite-deploy   (kubectl apply -k k8s/zerodha-kite + sops secret)
# Watch:    kubectl -n zerodha-kite get pods -w
# Reach:    http://avocado:30080/mcp  (MCP, streamable HTTP)  — TAILNET ONLY
#           http://avocado:30080/sse  (MCP, SSE transport)
#           http://avocado:30080/     (status page)
# See docs/zerodha-kite.md for the client setup and the Kite Connect app steps.
#
# WHY NodePort and not a Traefik ingress like the other services: the auth flow
# is BROWSER-based. The `login` tool returns <PUBLIC_BASE_URL>/authorize; after
# the Kite login the browser is redirected to <PUBLIC_BASE_URL>/callback with a
# request_token. So the client's browser must reach the server at the exact
# same host:port as the MCP transport — a Host-header `*.avocado.local` route
# can't be used by a browser OAuth redirect. A fixed NodePort gives one real
# URL (avocado:30080) that both the MCP client and the browser hit directly.
#
# WHY this stays tailnet-only: tailscale0 is a trusted firewall interface
# (modules/tailscale.nix), but the NodePort range is NOT in the host's
# allowedTCPPorts (modules/k3s.nix). So the NodePort is reachable over the
# tailnet (avocado MagicDNS) but blocked on the WAN/LAN — no public exposure,
# no Cloudflare route. This is deliberate: the server can place REAL trades.
#
# WHY no EXCLUDED_TOOLS: this is a private, single-user instance behind the
# tailnet, so the full tool set (incl. place/modify/cancel order + GTT) is
# enabled. The hosted mcp.kite.trade strips destructive tools because it is
# public; we don't need to.
---
apiVersion: v1
kind: Namespace
metadata:
  name: zerodha-kite
---
# Non-secret configuration. KITE_API_KEY / KITE_API_SECRET are the only secrets
# and live in the sops-backed `zerodha-kite-secret` (applied by
# `just zerodha-kite-deploy`); everything else is here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zerodha-kite-env
  namespace: zerodha-kite
data:
  # hybrid = serve BOTH /mcp (streamable HTTP) and /sse (SSE) on one port, so
  # any client's preferred transport works.
  APP_MODE: hybrid
  APP_PORT: "8080"
  # Bind all interfaces inside the pod (default is localhost, unreachable from
  # the Service).
  APP_HOST: 0.0.0.0
  # The public, browser-facing base URL. MUST equal the NodePort URL below, and
  # MUST match the Redirect URL registered on the Kite Connect app
  # (<PUBLIC_BASE_URL>/callback). avocado resolves via Tailscale MagicDNS.
  PUBLIC_BASE_URL: http://avocado:30080
  LOG_LEVEL: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zerodha-kite
  namespace: zerodha-kite
spec:
  replicas: 1
  selector:
    matchLabels: { app: zerodha-kite }
  template:
    metadata:
      labels: { app: zerodha-kite }
      annotations:
        # Bump to roll the pod when the ConfigMap changes (env is not
        # auto-reloaded on ConfigMap edits).
        checksum/config: config-v1
    spec:
      containers:
        - name: zerodha-kite
          image: zerodha-kite:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          envFrom:
            # Non-secret config first, then the sops secret (KITE_API_KEY /
            # KITE_API_SECRET). The secret is applied by just zerodha-kite-deploy,
            # not part of the kustomize build.
            - configMapRef: { name: zerodha-kite-env }
            - secretRef: { name: zerodha-kite-secret }
          # The status page at / returns 200 once the server is up; use it as
          # the health signal (no dedicated /healthz on this server).
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "1000m", memory: "512Mi" }
          volumeMounts:
            # The instruments manager and Go runtime may write scratch files;
            # the image has no writable /tmp of its own.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# NodePort so the server is reachable at avocado:30080 directly (see the header
# note on why a browser-facing URL is required). 30080 mirrors the container's
# 8080 for legibility and is fixed so PUBLIC_BASE_URL / the Kite redirect URL
# stay stable across restarts.
apiVersion: v1
kind: Service
metadata:
  name: zerodha-kite
  namespace: zerodha-kite
spec:
  type: NodePort
  selector: { app: zerodha-kite }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
