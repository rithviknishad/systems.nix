---
# gatus.yaml — synthetic uptime monitoring for avocado.
#
# Gatus periodically probes internal services and public endpoints and pushes
# failures/recoveries straight to ntfy.sh via its NATIVE ntfy alerting provider
# (no Alertmanager in the path — this is a separate, self-contained pipeline
# from the metrics-based alerts). This is the avocado equivalent of the
# reference's Cloudprober + endpoint VMRules, trimmed to a single lightweight
# pod.
#
# >>> Uses the SAME ntfy topic as ntfy-alertmanager.yaml (default
#     `avocado-alerts`). Change both together if you switch to a private topic.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: monitoring
data:
  config.yaml: |
    # Gatus web UI / API listens here; exposed via the Ingress below.
    web:
      port: 8080

    # Dashboard defaults. Sort endpoints by group so the internal/public/ABDM
    # sections render as distinct blocks (users can still re-sort in-browser).
    ui:
      default-sort-by: group

    # In-memory store is plenty for a single node — no PVC needed. History is
    # lost on restart, which is fine (alerts are pushed, not polled).
    storage:
      type: memory

    # Push failures + recoveries to ntfy.sh.
    alerting:
      ntfy:
        url: "https://ntfy.sh"
        topic: "avocado-alerts"
        priority: 4
        # Emoji tags per state (ntfy renders these as icons).
        default-alert:
          enabled: true
          # Alert after 3 consecutive failures; resolve after 2 successes.
          failure-threshold: 3
          success-threshold: 2
          send-on-resolved: true
        # Per-group topic overrides: the ABDM reachability checks are
        # third-party gov endpoints, so their alerts go to a SEPARATE topic
        # (subscribe separately at https://ntfy.sh/avocado-abdm). Live/prod
        # gets priority 5 (urgent) vs sandbox's 4 (high).
        overrides:
          - group: "ABDM-SBX"
            topic: "avocado-abdm"
            priority: 4
          - group: "ABDM-LIVE"
            topic: "avocado-abdm"
            priority: 5

    endpoints:
      # --- In-cluster services (component liveness) --------------------------
      - name: grafana
        group: internal
        url: "http://grafana.monitoring.svc:3000/api/health"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: ntfy

      - name: victoriametrics
        group: internal
        url: "http://vmsingle-victoria-metrics-k8s-stack-vmks.monitoring.svc:8428/health"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: ntfy

      - name: victorialogs
        group: internal
        url: "http://victorialogs.monitoring.svc:9428/health"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: ntfy

      # ESPHome dashboard (hostNetwork pod — see k8s/esphome). No /health
      # endpoint; a 200 on / means the dashboard is alive. Probed via the
      # in-cluster Service, NOT the public URL, so Cloudflare Access (which
      # would answer with a login redirect) isn't in the measured path.
      - name: esphome
        group: internal
        url: "http://esphome.esphome.svc:6052/"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: ntfy

      # Formance Ledger API (k8s/formance). Probes the server's own health
      # endpoint via the in-cluster Service, not the public URL — the Console
      # host sits behind Cloudflare Access, which would answer with a login
      # redirect and mask a dead backend (same pattern as esphome above).
      - name: formance-ledger
        group: internal
        url: "http://ledger.formance.svc:3068/_healthcheck"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: ntfy

      # Bingo game (k8s/bingo). Probed via the in-cluster Service rather than
      # the public URL: bingo.rithviknishad.dev is currently behind Cloudflare
      # Access (a login 302 would mask a dead backend). A 200 on / means the
      # Koa/boardgame.io process (SPA + multiplayer socket) is alive. If the
      # host is ever made truly public, switch this to the public URL + a
      # [CERTIFICATE_EXPIRATION] check for edge coverage.
      - name: bingo
        group: internal
        url: "http://bingo.bingo.svc:8000/"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: ntfy

      # ONVIF Camera Testing Console (k8s/onvif-console) — probe the in-cluster
      # Service; the FastAPI sidecar serves the static UI at / (200). The
      # public host is Cloudflare Access-gated (a login 302 would mask a dead
      # backend), so probe the Service, not the edge.
      - name: onvif-console
        group: internal
        url: "http://onvif-console.onvif-console.svc:5800/"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: ntfy

      # --- Public endpoints (reachability + TLS expiry) ----------------------
      - name: rithviknishad.dev
        group: public
        url: "https://rithviknishad.dev"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 240h"
        alerts:
          - type: ntfy

      # Immich photos. Hits the app's own ping endpoint (not just the root /)
      # so this reflects Immich being alive, not merely the Cloudflare edge.
      - name: photos.rithviknishad.dev
        group: public
        url: "https://photos.rithviknishad.dev/api/server/ping"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[BODY].res == pong"
          - "[CERTIFICATE_EXPIRATION] > 240h"
        alerts:
          - type: ntfy

      # Kite Kubernetes dashboard (k8s/kite). /healthz is unauthenticated (the
      # pod's own liveness path), so probe the full public path + cert directly:
      # the GitHub OAuth login sits on the app routes, not on /healthz, so it
      # cannot mask a dead backend here.
      - name: kite.rithviknishad.dev
        group: public
        url: "https://kite.rithviknishad.dev/healthz"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 240h"
        alerts:
          - type: ntfy

      # --- ohcnetwork/care-avocado (k8s/care + k8s/care-teleicu) -------------
      # Public hosts get edge-path probes with TLS-expiry checks; components
      # without a public health surface are probed via in-cluster Services.

      # care backend API — its own ping endpoint, through the full public
      # path (edge -> tunnel -> Traefik -> gunicorn).
      - name: care-api
        group: ohcnetwork/care-avocado
        url: "https://care-api.rithviknishad.dev/ping/"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 240h"
        alerts:
          - type: ntfy

      # care_fe SPA — nginx serving the bundle.
      - name: care-fe
        group: ohcnetwork/care-avocado
        url: "https://care.rithviknishad.dev/"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 240h"
        alerts:
          - type: ntfy

      # MinIO — probed in-cluster (the public host only answers presigned
      # URLs meaningfully; the health endpoint is cleaner via the Service).
      - name: minio
        group: ohcnetwork/care-avocado
        url: "http://minio.care.svc:9000/minio/health/live"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: ntfy

      # TeleICU gateway middleware (daphne) — in-cluster; / serves the
      # gateway status page. The public host is covered by the nginx probe
      # below.
      - name: teleicu-middleware
        group: ohcnetwork/care-avocado
        url: "http://teleicu-middleware.care-teleicu.svc:8090/"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: ntfy

      # TeleICU gateway public edge — / is proxied by the upstream nginx to
      # the middleware's status page, so this measures the full
      # edge->tunnel->nginx->daphne path (+ cert).
      - name: teleicu-gateway-edge
        group: ohcnetwork/care-avocado
        url: "https://care-teleicu-gateway.rithviknishad.dev/"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 240h"
        alerts:
          - type: ntfy

      # Devices micro-frontend — upstream nginx.conf serves /health.
      - name: teleicu-devices-fe
        group: ohcnetwork/care-avocado
        url: "https://care-teleicu-devices.rithviknishad.dev/health"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 240h"
        alerts:
          - type: ntfy

      # RTSPtoWeb stream server — in-cluster; any HTTP answer proves the
      # process is up (its UI may 401 depending on config).
      - name: teleicu-stream-server
        group: ohcnetwork/care-avocado
        url: "http://stream-server.care-teleicu.svc:8080/"
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
          - "[STATUS] < 500"
        alerts:
          - type: ntfy

      # --- ohcnetwork/teleicu/cameras (own subgroup: cameras are numerous,
      # site-specific, and physically fragile — kept out of the main
      # ohcnetwork/care rollup so camera flakiness doesn't dilute it). ------

      # Mock PTZ camera (test fixture) — the web UI answers 401 without
      # camera credentials, which still proves the ONVIF/RTSP sim is alive,
      # so assert reachable + non-5xx. The mock vitals devices are
      # outbound-only (no port to probe); their failures surface as missing
      # observations instead.
      - name: mock-ptz-camera
        group: ohcnetwork/teleicu/cameras
        url: "http://mock-ptz-camera.care-teleicu.svc:8080/"
        interval: 5m
        conditions:
          - "[CONNECTED] == true"
          - "[STATUS] < 500"
        alerts:
          - type: ntfy

      # Mock PTZ camera public edge — same UI exposed at the tunnel host
      # (admin/admin, no Access gate). 401 without creds still proves the
      # full edge->tunnel->Traefik->pod path is alive; + cert expiry.
      - name: mock-ptz-camera.rithviknishad.dev
        group: ohcnetwork/teleicu/cameras
        url: "https://mock-ptz-camera.rithviknishad.dev/"
        interval: 5m
        conditions:
          - "[CONNECTED] == true"
          - "[STATUS] < 500"
          - "[CERTIFICATE_EXPIRATION] > 240h"
        alerts:
          - type: ntfy

      # Physical TeleICU cameras (CARE camera devices) — a raw TCP connect to
      # the RTSP port (554) is the health signal that matters: if the camera
      # loses power/network the feed is dead, and nothing downstream (RTSPtoWeb
      # on_demand + token auth) is probeable without a live viewer. In-cluster
      # egress reaches these LAN IPs via node SNAT. Names match the CARE
      # devices; add one line per camera you onboard.
      - name: matrix-cctv
        group: ohcnetwork/teleicu/cameras
        url: "tcp://192.168.165.126:554"
        interval: 5m
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: ntfy

      - name: prama-cctv
        group: ohcnetwork/teleicu/cameras
        url: "tcp://192.168.165.121:554"
        interval: 5m
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: ntfy

      # --- ABDM sandbox (third-party, not ours) ------------------------------
      # External ABDM APIs we don't control. "Up" = the host is REACHABLE and
      # not returning a server error: [CONNECTED] guards the unreachable case
      # (a failed connection reports [STATUS] 0, which would otherwise satisfy
      # [STATUS] < 500), and [STATUS] < 500 rejects 5xx. 2xx/3xx/4xx (incl.
      # auth-required) all count as serving. Alerts -> avocado-abdm topic.
      - name: NHPR
        group: ABDM-SBX
        url: "https://apihspsbx.abdm.gov.in/v4/"
        interval: 5m
        conditions:
          - "[CONNECTED] == true"
          - "[STATUS] < 500"
        alerts:
          - type: ntfy

      - name: ABHA
        group: ABDM-SBX
        url: "https://abhasbx.abdm.gov.in/abha/api"
        interval: 5m
        conditions:
          - "[CONNECTED] == true"
          - "[STATUS] < 500"
        alerts:
          - type: ntfy

      - name: HIECM
        group: ABDM-SBX
        url: "https://dev.abdm.gov.in/api/hiecm"
        interval: 5m
        conditions:
          - "[CONNECTED] == true"
          - "[STATUS] < 500"
        alerts:
          - type: ntfy

      # --- ABDM live / production (third-party, not ours) --------------------
      # Same "reachable and non-5xx" contract as sandbox; alerts fire at
      # priority 5 (urgent) on the avocado-abdm topic.
      - name: NHPR
        group: ABDM-LIVE
        url: "https://apinhpr.abdm.gov.in/v4/"
        interval: 5m
        conditions:
          - "[CONNECTED] == true"
          - "[STATUS] < 500"
        alerts:
          - type: ntfy

      - name: ABHA
        group: ABDM-LIVE
        url: "https://abha.abdm.gov.in/abha/api"
        interval: 5m
        conditions:
          - "[CONNECTED] == true"
          - "[STATUS] < 500"
        alerts:
          - type: ntfy

      - name: HIECM
        group: ABDM-LIVE
        url: "https://apis.abdm.gov.in/api/hiecm"
        interval: 5m
        conditions:
          - "[CONNECTED] == true"
          - "[STATUS] < 500"
        alerts:
          - type: ntfy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: gatus
    app.kubernetes.io/component: uptime
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gatus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gatus
      annotations:
        # Bump to roll the pod when the config changes.
        checksum/config: config-v18
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gatus
          # Pinned to a released tag (multi-arch amd64/arm64).
          image: ghcr.io/twin/gatus:v5.36.0
          env:
            # Point Gatus at the mounted ConfigMap directory (it merges every
            # *.yaml under this path).
            - name: GATUS_CONFIG_PATH
              value: /config
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: gatus-config
---
apiVersion: v1
kind: Service
metadata:
  name: gatus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: gatus
spec:
  selector:
    app.kubernetes.io/name: gatus
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gatus
  namespace: monitoring
spec:
  rules:
    - host: status.avocado.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gatus
                port:
                  number: 8080
    - host: status.rithviknishad.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gatus
                port:
                  number: 8080
