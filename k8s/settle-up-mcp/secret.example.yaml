# Shape of the `settle-up-mcp-secret` Secret consumed by the Settle Up MCP
# Deployment.
#
# The REAL values live sops-encrypted in secrets/settle-up-mcp.enc.yaml and are
# applied by `just settle-up-mcp-deploy` — this file is only a reference and is
# safe to commit (no real secrets here). To create/edit the encrypted copy:
#
#   just settle-up-mcp-secrets     # opens secrets/settle-up-mcp.enc.yaml in sops
#
# Paste your real values, then deploy:
#
#   just settle-up-mcp-deploy
#
# Keys:
#   SETTLEUP_EMAIL              The email of your Settle Up account.
#   SETTLEUP_PASSWORD           That account's password. The server signs in
#                               with Firebase email/password auth on demand, so
#                               this is the real account password — which is
#                               exactly why the server is tailnet-only.
#   SETTLEUP_FIREBASE_API_KEY   The Firebase Web API key from the Settle Up API
#                               docs. MUST be the **live** key: the ConfigMap
#                               pins SETTLEUP_BASE_URL to the live backend, and
#                               the sandbox key will not authenticate against it.
#   MCP_AUTH_TOKEN              The bearer token every MCP client must send as
#                               `Authorization: Bearer <token>`. Generate a
#                               strong one, e.g. `openssl rand -hex 32`.
#
# WARNING: if MCP_AUTH_TOKEN is empty the server accepts EVERY request with no
# authentication at all. Never deploy with it blank.
apiVersion: v1
kind: Secret
metadata:
  name: settle-up-mcp-secret
  namespace: settle-up-mcp
stringData:
  SETTLEUP_EMAIL: CHANGE_ME
  SETTLEUP_PASSWORD: CHANGE_ME
  SETTLEUP_FIREBASE_API_KEY: CHANGE_ME
  MCP_AUTH_TOKEN: CHANGE_ME_STRONG_RANDOM
