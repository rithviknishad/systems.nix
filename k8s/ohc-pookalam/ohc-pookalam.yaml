# Onam Pookalam Vote — a small GitHub-username-gated voting site for the OHC
# Network (rithviknishad/ohc-pookalam), running on k3s.
#
# Deploy:   just ohc-pookalam-images && just ohc-pookalam-deploy
# Watch:    kubectl -n ohc-pookalam get pods -w
# Visit:    https://ohc-pookalam.rithviknishad.dev  (Cloudflare Tunnel)
#           http://avocado (Host: ohc-pookalam.avocado.local) over Tailscale
#
# The upstream repo ships its own Dockerfile (Next.js 16 standalone + a native
# better-sqlite3 build), so the image is built ON the box with docker and
# imported straight into containerd — same no-registry pattern as CARE, and
# far less friction than nixifying a pnpm + node-gyp build.
---
apiVersion: v1
kind: Namespace
metadata:
  name: ohc-pookalam
---
# The whole app is one SQLite file (+ its -wal/-shm siblings) under /data.
# Losing this PVC loses every vote, so it is the only stateful piece here.
# 1Gi is absurdly generous for a few hundred rows, but local-path carves it
# out of the ZFS rpool lazily — nothing is preallocated.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pookalam-data
  namespace: ohc-pookalam
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ohc-pookalam
  namespace: ohc-pookalam
spec:
  # replicas: 1 is NOT a resource decision — SQLite is a single-writer file.
  # Two pods sharing the PVC would corrupt the votes. Do not scale this out.
  replicas: 1
  # Recreate, not RollingUpdate: the RWO PVC can't be mounted by the old and
  # new pod at once on a single node, and even if it could, two processes must
  # never hold the same SQLite file open for writes.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: ohc-pookalam }
  template:
    metadata:
      labels: { app: ohc-pookalam }
    spec:
      containers:
        - name: ohc-pookalam
          # Built by `just ohc-pookalam-images` and imported into containerd —
          # there is no registry to pull from, hence IfNotPresent.
          image: ohc-pookalam:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          env:
            - name: POOKALAM_DB_PATH
              value: /data/pookalam.db
          # GITHUB_TOKEN lifts the GitHub API rate limit for username lookups
          # from 60/h to 5000/h. optional: true so the app still runs before
          # the secret exists — it just gets the anonymous limit, which a
          # public vote will burn through fast. See secret.example.yaml.
          envFrom:
            - secretRef:
                name: ohc-pookalam-secret
                optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          # No dedicated health route upstream; a 200 on / means Next.js is
          # serving and could open the database (the gallery page reads it).
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: "25m", memory: "128Mi" }
            limits: { cpu: "1", memory: "512Mi" }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: pookalam-data }
---
apiVersion: v1
kind: Service
metadata:
  name: ohc-pookalam
  namespace: ohc-pookalam
spec:
  selector: { app: ohc-pookalam }
  ports: [{ port: 3000, targetPort: 3000 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ohc-pookalam
  namespace: ohc-pookalam
spec:
  rules:
    # Public host (Cloudflare Tunnel -> Traefik). Deliberately NOT behind
    # Cloudflare Access: the whole point is that anyone in the community can
    # open the link and vote. The app has its own (trust-based) GitHub
    # username sign-in; an SSO wall would defeat the purpose.
    # One label only — Universal SSL covers *.rithviknishad.dev, not deeper.
    - host: ohc-pookalam.rithviknishad.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ohc-pookalam
                port:
                  number: 3000
    # Tailnet host: curl -H 'Host: ohc-pookalam.avocado.local' http://avocado/
    - host: ohc-pookalam.avocado.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ohc-pookalam
                port:
                  number: 3000
