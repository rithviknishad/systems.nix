# care-box: ONE origin per way in, each path-routed like avocado's `care`
# Ingress (k8s/care/care.yaml), with paths forwarded unmodified. Both servers
# are loopback only. Installed to /etc/nginx/conf.d/ by lumine/provision.sh;
# see docs/care-box.md. Static files and the SPA come from
# snippets/care-box-static.conf (lumine/nginx/snippets/), shared by both.
#
# Django admin is deliberately NOT routed on either: only /api/ reaches the
# backend, so /admin/* is the SPA's own admin UI on these origins.

# https://care-box.rithviknishad.dev: cloudflared (lumine/cloudflared/
# config.yml) is the sole client.
server {
  listen 127.0.0.1:80 default_server;
  server_name care-box.rithviknishad.dev;

  include snippets/care-box-static.conf;

  # The SPA's API and the ABDM callbacks (/api/abdm/...). Requests are
  # buffered (nginx's default), which keeps slow clients off gunicorn's sync
  # workers; uploads don't come through here (they go to the buckets).
  location /api/ {
    proxy_pass http://127.0.0.1:9000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # https, as set by cloudflared; Django trusts it (SECURE_PROXY_SSL_HEADER)
    # to build correct absolute URLs. Only cloudflared can reach this server.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Presigned uploads/downloads and facility cover URLs, path-style.
  # (/|$) so bucket-level requests (e.g. an anonymous LIST of /care-uploads)
  # reach the gateway and get its 403, rather than the SPA's index.html.
  location ~ ^/(care-uploads|care-facility)(/|$) {
    proxy_pass http://127.0.0.1:7070;
    # SigV4 signs Host: the gateway must see the host the URL was signed for.
    proxy_set_header Host $host;
    # Stream bodies through instead of spooling up to 100 MB per upload onto
    # the disk (and downloads into memory).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
  }
}

# https://care-box.orthrus-bass.ts.net: the Tailscale Service svc:care-box.
# tailscaled terminates TLS on the Service's VIP and proxies here (set up by
# provision.sh); it is the sole client. Fully same-origin on the tailnet
# name, without touching the backend's config: the backend still builds
# every absolute URL (presigned uploads, facility covers, the ABDM plug's
# remoteEntry.js) from the public origin, so API responses get that origin
# rewritten to this one, and the buckets are told the public host the URLs
# were signed for.
server {
  listen 127.0.0.1:8080 default_server;
  server_name care-box.orthrus-bass.ts.net;

  include snippets/care-box-static.conf;

  location /api/ {
    proxy_pass http://127.0.0.1:9000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Only tailscaled's HTTPS listener reaches this server.
    proxy_set_header X-Forwarded-Proto https;
    # sub_filter can't see into compressed bodies. gunicorn doesn't compress
    # today; this keeps it that way should GZipMiddleware ever be enabled.
    proxy_set_header Accept-Encoding "";
    sub_filter_types application/json;
    sub_filter_once off;
    sub_filter "https://care-box.rithviknishad.dev" "https://care-box.orthrus-bass.ts.net";
  }

  location ~ ^/(care-uploads|care-facility)(/|$) {
    proxy_pass http://127.0.0.1:7070;
    # The URL's host was rewritten above, but its SigV4 signature covers the
    # public host it was signed for: hand the gateway that one.
    proxy_set_header Host care-box.rithviknishad.dev;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
  }
}
