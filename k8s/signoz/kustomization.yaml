---
# kustomization.yaml — the avocado-specific glue around the SigNoz helm chart.
#
# Apply AFTER the helm release (which installs the ClickHouse operator + CRDs):
#   just signoz-deploy    # namespace -> helmfile sync -> `kubectl apply -k` this dir
#
# The chart (helmfile.yaml + values.yaml) owns ClickHouse, Zookeeper, the query
# service, the OTel collector and the schema migrator. This layer only adds
# what the chart doesn't:
#   - Namespace (PodSecurity labels) — also applied first by `just signoz-deploy`.
#   - Traefik Ingress for the UI (the chart's own ingress is disabled in
#     values.yaml so host routing stays with every other workload in this repo).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - ingress.yaml
  # Metrics: hand the collector's own telemetry to the VictoriaMetrics stack
  # (needs the VM Operator CRDs from k8s/monitoring, which are already there).
  - vmservicescrape.yaml

# The ClickHouse password is NOT part of this build. It lives sops-encrypted at
# secrets/signoz.enc.yaml and is fed to helm at deploy time via the gitignored
# values-secret.yaml. See values-secret.example.yaml.
