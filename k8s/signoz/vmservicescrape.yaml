---
# vmservicescrape.yaml — let the EXISTING VictoriaMetrics stack watch SigNoz.
#
# SigNoz's components annotate themselves with `signoz.io/scrape`, which only
# SigNoz's own collector understands — so without this, the ingest pipeline is
# a black box to Grafana and VMAlert. VMAgent runs with `selectAllByDefault`
# across all namespaces (k8s/monitoring/values.yaml), so a VMServiceScrape here
# is picked up with no change on the monitoring side.
#
# This is deliberately one-directional: the infra stack observes SigNoz, not
# the other way round. Keeping the watcher outside the thing being watched is
# the whole point — if ClickHouse dies, the alert still has somewhere to come
# from. Useful series once this is live: `otelcol_receiver_accepted_spans`,
# `otelcol_exporter_send_failed_spans`, `otelcol_processor_dropped_*`.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: signoz-otel-collector
  namespace: signoz
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: signoz
      app.kubernetes.io/component: otel-collector
  endpoints:
    # The collector's own Prometheus telemetry endpoint (chart default port).
    - port: metrics
      interval: 30s
