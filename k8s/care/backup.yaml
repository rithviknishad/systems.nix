# Nightly logical backups of the care Postgres DB.
#
# pg_dump (custom format, compressed) into a dedicated PVC, keeping 14 days.
# This protects against app-level disasters (bad migration, fat-fingered
# delete) which ZFS-level redundancy would faithfully preserve.
#
# Layers protecting this database, weakest to strongest:
#   1. ZFS snapshots of rpool/var (modules/zfs.nix) — block-level undo, same
#      pool, covers "I deleted it 20 minutes ago".
#   2. These pg_dumps — portable, verifiable, restorable into another
#      Postgres; on local-path-retain so they OUTLIVE the namespace.
#   3. An offsite copy — still to be wired (docs/care.md "Backups").
#
# >>> The PVC lives on the SAME striped, non-redundant rpool as the database
#     itself, so this is still NOT disaster recovery: it survives an operator
#     mistake, not a disk failure. Only (3) covers losing a disk.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: care-db-backups
  namespace: care
spec:
  accessModes: [ReadWriteOnce]
  # Retain, NOT the default local-path: on 2026-08-31 `kubectl delete ns care`
  # destroyed this volume along with the database it existed to protect. With
  # Retain the PV survives the namespace and the dumps stay on disk.
  # See k8s/storage/local-path-retain.yaml.
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: care-db-backup
  namespace: care
spec:
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:17-alpine
              envFrom:
                - secretRef: { name: care-secret }
              command:
                - sh
                - -c
                # -Fc: custom format (compressed, pg_restore-able with
                # --clean). Prune to 14 daily dumps; care DBs are small.
                # -maxdepth 1: find recurses and -name matches basenames, so
                # without it the prune would also eat pinned/care-*.dump
                # (just care-db-pin), which must live until deleted by hand.
                - |
                  set -eu
                  pg_dump "$DATABASE_URL" -Fc -f "/backups/care-$(date +%F).dump"
                  find /backups -maxdepth 1 -name 'care-*.dump' -mtime +14 -delete
                  ls -lh /backups
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim: { claimName: care-db-backups }
